<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D8C4E',
                        secondary: '#FF6B35',
                        accent: '#FFB800',
                        bgMain: '#F5F5F5',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background: #F5F5F5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-bgMain w-[430px] h-[932px] overflow-hidden relative">
    <!-- Header -->
    <div class="bg-gradient-to-r from-primary to-green-400 px-4 py-4">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-leaf text-white text-lg"></i>
                </div>
                <div>
                    <p class="text-white font-bold">象山鲜送</p>
                    <p class="text-white/70 text-xs">商家后台</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <i class="fas fa-bell text-white text-lg relative">
                    <span class="absolute -top-1 -right-1 bg-secondary text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">3</span>
                </i>
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-primary text-sm"></i>
                </div>
            </div>
        </div>
        <div class="text-white/80 text-sm">下午好，商家管理员</div>
    </div>

    <!-- Content -->
    <div class="h-[calc(100%-100px)] overflow-y-auto">
        <!-- Stats Cards -->
        <div class="px-4 -mt-3">
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <div class="grid grid-cols-4 gap-2">
                    <div class="text-center">
                        <p class="text-2xl font-bold text-primary">45</p>
                        <p class="text-xs text-gray-500 mt-1">今日订单</p>
                    </div>
                    <div class="text-center border-l border-gray-100">
                        <p class="text-2xl font-bold text-secondary">¥1,856</p>
                        <p class="text-xs text-gray-500 mt-1">今日销售额</p>
                    </div>
                    <div class="text-center border-l border-gray-100">
                        <p class="text-2xl font-bold text-orange-500">8</p>
                        <p class="text-xs text-gray-500 mt-1">待处理</p>
                    </div>
                    <div class="text-center border-l border-gray-100">
                        <p class="text-2xl font-bold text-red-500">3</p>
                        <p class="text-xs text-gray-500 mt-1">库存预警</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="px-4 mt-4">
            <div class="bg-white rounded-xl p-4">
                <p class="font-bold text-gray-800 mb-3">快捷操作</p>
                <div class="grid grid-cols-4 gap-3">
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center">
                            <i class="fas fa-plus-circle text-primary text-xl"></i>
                        </div>
                        <span class="text-xs text-gray-600">添加商品</span>
                    </div>
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center">
                            <i class="fas fa-file-alt text-blue-500 text-xl"></i>
                        </div>
                        <span class="text-xs text-gray-600">处理订单</span>
                    </div>
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-12 h-12 bg-yellow-50 rounded-full flex items-center justify-center">
                            <i class="fas fa-box text-yellow-500 text-xl"></i>
                        </div>
                        <span class="text-xs text-gray-600">库存管理</span>
                    </div>
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-12 h-12 bg-purple-50 rounded-full flex items-center justify-center">
                            <i class="fas fa-bullhorn text-purple-500 text-xl"></i>
                        </div>
                        <span class="text-xs text-gray-600">发布公告</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pending Orders -->
        <div class="px-4 mt-4">
            <div class="bg-white rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                    <p class="font-bold text-gray-800">待处理订单</p>
                    <span class="text-xs text-primary">查看全部</span>
                </div>
                <div class="space-y-3">
                    <!-- Order 1 -->
                    <div class="border border-orange-200 bg-orange-50/50 rounded-lg p-3">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-medium text-orange-600">#NX20260509001</span>
                            <span class="text-xs text-orange-500">待接单</span>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 bg-green-100 rounded flex items-center justify-center text-sm">🥬</div>
                            <div class="w-8 h-8 bg-red-100 rounded flex items-center justify-center text-sm">🍅</div>
                            <div class="w-8 h-8 bg-orange-100 rounded flex items-center justify-center text-sm">🥕</div>
                            <span class="text-xs text-gray-500">共3件</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">用户：张三 · 138****8888</span>
                            <span class="text-sm font-bold text-secondary">¥10.96</span>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <button class="flex-1 py-1.5 border border-gray-300 text-gray-600 text-xs rounded">拒绝</button>
                            <button class="flex-1 py-1.5 bg-primary text-white text-xs rounded">接单</button>
                        </div>
                    </div>
                    <!-- Order 2 -->
                    <div class="border border-orange-200 bg-orange-50/50 rounded-lg p-3">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-medium text-orange-600">#NX20260509002</span>
                            <span class="text-xs text-orange-500">待接单</span>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 bg-yellow-100 rounded flex items-center justify-center text-sm">🍄</div>
                            <div class="w-8 h-8 bg-purple-100 rounded flex items-center justify-center text-sm">🫘</div>
                            <span class="text-xs text-gray-500">共2件</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">用户：李四 · 139****9999</span>
                            <span class="text-sm font-bold text-secondary">¥18.98</span>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <button class="flex-1 py-1.5 border border-gray-300 text-gray-600 text-xs rounded">拒绝</button>
                            <button class="flex-1 py-1.5 bg-primary text-white text-xs rounded">接单</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sales Chart Placeholder -->
        <div class="px-4 mt-4 pb-4">
            <div class="bg-white rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                    <p class="font-bold text-gray-800">销售趋势</p>
                    <div class="flex items-center gap-1 text-xs">
                        <span class="bg-primary/10 text-primary px-2 py-0.5 rounded">本周</span>
                        <span class="text-gray-400 px-2 py-0.5">本月</span>
                    </div>
                </div>
                <div class="h-32 flex items-end justify-around gap-1">
                    <div class="flex-1 bg-green-200 rounded-t" style="height: 60%"></div>
                    <div class="flex-1 bg-green-300 rounded-t" style="height: 75%"></div>
                    <div class="flex-1 bg-green-400 rounded-t" style="height: 45%"></div>
                    <div class="flex-1 bg-green-500 rounded-t" style="height: 85%"></div>
                    <div class="flex-1 bg-green-400 rounded-t" style="height: 70%"></div>
                    <div class="flex-1 bg-green-300 rounded-t" style="height: 55%"></div>
                    <div class="flex-1 bg-primary rounded-t" style="height: 90%"></div>
                </div>
                <div class="flex justify-around mt-2 text-xs text-gray-400">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>日</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 h-16 flex items-center">
        <div class="flex-1 flex flex-col items-center gap-0.5 text-primary">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs">首页</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-box text-xl"></i>
            <span class="text-xs">商品</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-file-alt text-xl"></i>
            <span class="text-xs">订单</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-chart-bar text-xl"></i>
            <span class="text-xs">统计</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs">设置</span>
        </div>
    </div>
</body>
</html>
