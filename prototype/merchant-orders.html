<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D8C4E',
                        secondary: '#FF6B35',
                        accent: '#FFB800',
                        bgMain: '#F5F5F5',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background: #F5F5F5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-bgMain w-[430px] h-[932px] overflow-hidden relative">
    <!-- Header -->
    <div class="bg-gradient-to-r from-primary to-green-400 px-4 py-4">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-leaf text-white text-lg"></i>
                </div>
                <div>
                    <p class="text-white font-bold">象山鲜送</p>
                    <p class="text-white/70 text-xs">商家后台</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <i class="fas fa-bell text-white text-lg relative">
                    <span class="absolute -top-1 -right-1 bg-secondary text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">3</span>
                </i>
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-primary text-sm"></i>
                </div>
            </div>
        </div>
        <div class="text-white/80 text-sm">订单管理</div>
    </div>

    <!-- Filter Tabs -->
    <div class="bg-white border-b border-gray-100">
        <div class="flex px-4">
            <div class="flex-1 py-3 text-center text-sm font-medium text-primary border-b-2 border-primary">待处理</div>
            <div class="flex-1 py-3 text-center text-sm font-medium text-gray-400">待取货</div>
            <div class="flex-1 py-3 text-center text-sm font-medium text-gray-400">配送中</div>
            <div class="flex-1 py-3 text-center text-sm font-medium text-gray-400">已完成</div>
        </div>
    </div>

    <!-- Content -->
    <div class="h-[calc(100%-160px)] overflow-y-auto">
        <!-- Order 1 - Pending -->
        <div class="mx-4 mt-4 bg-white rounded-xl p-4 border-l-4 border-orange-400">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-800">#NX20260509001</span>
                    <span class="bg-orange-100 text-orange-500 text-xs px-2 py-0.5 rounded">待接单</span>
                </div>
                <span class="text-xs text-gray-400">08:25</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-green-100 rounded flex items-center justify-center text-sm">🥬</div>
                <div class="w-8 h-8 bg-red-100 rounded flex items-center justify-center text-sm">🍅</div>
                <div class="w-8 h-8 bg-orange-100 rounded flex items-center justify-center text-sm">🥕</div>
                <span class="text-xs text-gray-500 ml-1">共3件</span>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-500">用户：张三 · 138****8888</span>
                <span class="text-sm font-bold text-secondary">¥10.96</span>
            </div>
            <div class="flex gap-2 mt-3">
                <button class="flex-1 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg">拒绝</button>
                <button class="flex-1 py-2 bg-primary text-white text-sm rounded-lg">接单</button>
            </div>
        </div>

        <!-- Order 2 - Pending -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4 border-l-4 border-orange-400">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-800">#NX20260509002</span>
                    <span class="bg-orange-100 text-orange-500 text-xs px-2 py-0.5 rounded">待接单</span>
                </div>
                <span class="text-xs text-gray-400">14:30</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-yellow-100 rounded flex items-center justify-center text-sm">🍄</div>
                <div class="w-8 h-8 bg-purple-100 rounded flex items-center justify-center text-sm">🫘</div>
                <span class="text-xs text-gray-500 ml-1">共2件</span>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-500">用户：李四 · 139****9999</span>
                <span class="text-sm font-bold text-secondary">¥18.98</span>
            </div>
            <div class="flex gap-2 mt-3">
                <button class="flex-1 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg">拒绝</button>
                <button class="flex-1 py-2 bg-primary text-white text-sm rounded-lg">接单</button>
            </div>
        </div>

        <!-- Order 3 - Pending -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4 border-l-4 border-orange-400">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-800">#NX20260509003</span>
                    <span class="bg-orange-100 text-orange-500 text-xs px-2 py-0.5 rounded">待接单</span>
                </div>
                <span class="text-xs text-gray-400">16:15</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-100 rounded flex items-center justify-center text-sm">🥦</div>
                <div class="w-8 h-8 bg-yellow-100 rounded flex items-center justify-center text-sm">🌽</div>
                <div class="w-8 h-8 bg-green-100 rounded flex items-center justify-center text-sm">🥬</div>
                <span class="text-xs text-gray-500 ml-1">共3件</span>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-500">用户：王五 · 137****7777</span>
                <span class="text-sm font-bold text-secondary">¥25.96</span>
            </div>
            <div class="flex gap-2 mt-3">
                <button class="flex-1 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg">拒绝</button>
                <button class="flex-1 py-2 bg-primary text-white text-sm rounded-lg">接单</button>
            </div>
        </div>

        <!-- Order 4 - Pending -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4 border-l-4 border-orange-400 mb-4">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-800">#NX20260509004</span>
                    <span class="bg-orange-100 text-orange-500 text-xs px-2 py-0.5 rounded">待接单</span>
                </div>
                <span class="text-xs text-gray-400">17:45</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-red-100 rounded flex items-center justify-center text-sm">🍅</div>
                <span class="text-xs text-gray-500 ml-1">共1件</span>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-500">用户：赵六 · 136****6666</span>
                <span class="text-sm font-bold text-secondary">¥4.99</span>
            </div>
            <div class="flex gap-2 mt-3">
                <button class="flex-1 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg">拒绝</button>
                <button class="flex-1 py-2 bg-primary text-white text-sm rounded-lg">接单</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 h-16 flex items-center">
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs">首页</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-box text-xl"></i>
            <span class="text-xs">商品</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-primary">
            <i class="fas fa-file-alt text-xl"></i>
            <span class="text-xs">订单</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-chart-bar text-xl"></i>
            <span class="text-xs">统计</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-xs">设置</span>
        </div>
    </div>
</body>
</html>
