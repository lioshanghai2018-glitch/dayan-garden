<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D8C4E',
                        secondary: '#FF6B35',
                        accent: '#FFB800',
                        bgMain: '#F5F5F5',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background: #F5F5F5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-bgMain w-[430px] h-[932px] overflow-hidden relative">
    <!-- Status Bar -->
    <div class="h-12 bg-primary flex items-center justify-between px-6 text-sm font-medium text-white">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs ml-1"></i>
            <i class="fas fa-battery-full text-xs ml-1"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-primary px-4 pb-6 pt-1">
        <div class="flex items-center gap-3">
            <i class="fas fa-chevron-left text-white"></i>
            <h1 class="text-lg font-bold text-white flex-1 text-center pr-8">配送中</h1>
            <i class="fas fa-headset text-white"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="h-[calc(100%-48px)] overflow-y-auto -mt-4">
        <!-- Active Delivery Card -->
        <div class="mx-4 mt-4 bg-white rounded-xl overflow-hidden">
            <div class="bg-gradient-to-r from-primary to-green-400 px-4 py-3 text-white">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-truck"></i>
                        <span class="font-medium">正在配送</span>
                    </div>
                    <span class="text-xs bg-white/20 px-2 py-0.5 rounded">剩余 15 分钟</span>
                </div>
            </div>
            <div class="p-4">
                <!-- Delivery Progress -->
                <div class="mb-4">
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                        <span>商家发货</span>
                        <span>骑手取货</span>
                        <span>配送中</span>
                        <span>已送达</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded-full">
                        <div class="h-2 bg-primary rounded-full" style="width: 60%"></div>
                    </div>
                </div>

                <!-- Customer Info -->
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-2xl">👤</div>
                    <div class="flex-1">
                        <p class="font-medium text-gray-800">张三 · 138****8888</p>
                        <p class="text-xs text-gray-400 mt-0.5">XX小区 1栋 1001室</p>
                    </div>
                    <div class="flex gap-2">
                        <button class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-phone text-green-600"></i>
                        </button>
                        <button class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-comment-dots text-blue-600"></i>
                        </button>
                    </div>
                </div>

                <!-- Store Info -->
                <div class="flex items-center gap-3 mb-3 p-3 bg-gray-50 rounded-lg">
                    <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center text-lg">👨‍🌾</div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-800">大研本地农场</p>
                        <p class="text-xs text-gray-400">已取货 · 08:45</p>
                    </div>
                </div>

                <!-- Order Items -->
                <div class="bg-gray-50 rounded-lg p-3 mt-3">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xs text-gray-500">订单号：NX20260509001</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-green-100 rounded flex items-center justify-center text-sm">🥬</div>
                        <div class="w-8 h-8 bg-red-100 rounded flex items-center justify-center text-sm">🍅</div>
                        <div class="w-8 h-8 bg-orange-100 rounded flex items-center justify-center text-sm">🥕</div>
                        <span class="text-xs text-gray-500">共3件</span>
                    </div>
                </div>

                <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
                    <span class="text-sm text-gray-500">配送距离 1.2km</span>
                    <span class="text-secondary font-bold">¥10.96</span>
                </div>

                <button class="w-full mt-3 h-11 bg-primary text-white rounded-lg font-medium">
                    确认送达
                </button>
            </div>
        </div>

        <!-- Queue Info -->
        <div class="mx-4 mt-4 bg-white rounded-xl p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-list text-blue-500"></i>
                    </div>
                    <div>
                        <p class="font-medium text-gray-800">配送队列</p>
                        <p class="text-xs text-gray-400">当前有 2 单待配送</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>

        <!-- Today's Stats -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4 mb-4">
            <p class="font-medium text-gray-800 mb-3">今日配送</p>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div>
                    <p class="text-2xl font-bold text-primary">8</p>
                    <p class="text-xs text-gray-400 mt-1">完成订单</p>
                </div>
                <div>
                    <p class="text-2xl font-bold text-secondary">2</p>
                    <p class="text-xs text-gray-400 mt-1">配送中</p>
                </div>
                <div>
                    <p class="text-2xl font-bold text-accent">¥45.60</p>
                    <p class="text-xs text-gray-400 mt-1">今日收入</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 h-20 flex items-start pt-1">
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs">首页</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-th-large text-xl"></i>
            <span class="text-xs">分类</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400 relative">
            <i class="fas fa-shopping-cart text-xl"></i>
            <span class="text-xs">购物车</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-primary">
            <i class="fas fa-truck text-xl"></i>
            <span class="text-xs">配送中</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-0.5 text-gray-400">
            <i class="fas fa-user text-xl"></i>
            <span class="text-xs">我的</span>
        </div>
    </div>
</body>
</html>
