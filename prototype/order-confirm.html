<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D8C4E',
                        secondary: '#FF6B35',
                        accent: '#FFB800',
                        bgMain: '#F5F5F5',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background: #F5F5F5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-bgMain w-[430px] h-[932px] overflow-hidden relative">
    <!-- Status Bar -->
    <div class="h-12 bg-primary flex items-center justify-between px-6 text-sm font-medium text-white">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs ml-1"></i>
            <i class="fas fa-battery-full text-xs ml-1"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-primary px-4 pb-4 pt-1">
        <div class="flex items-center gap-3">
            <i class="fas fa-chevron-left text-white"></i>
            <h1 class="text-lg font-bold text-white flex-1 text-center pr-8">确认订单</h1>
        </div>
    </div>

    <!-- Content -->
    <div class="h-[calc(100%-180px)] overflow-y-auto">
        <!-- Address -->
        <div class="mx-4 -mt-4 bg-white rounded-xl p-4 relative">
            <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-primary text-white text-xs px-3 py-1 rounded-full">
                默认
            </div>
            <div class="flex items-start gap-3">
                <i class="fas fa-map-marker-alt text-primary text-xl mt-1"></i>
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="font-medium text-gray-800">张三</span>
                        <span class="text-gray-600">138****8888</span>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">云南省丽江市古城区大研镇XX小区1栋1001</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>

        <!-- Delivery Time -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="font-medium text-gray-800">配送时间</span>
            </div>
            <div class="flex gap-2">
                <div class="flex-1 bg-primary/10 border-2 border-primary rounded-lg p-2 text-center">
                    <p class="text-sm font-medium text-primary">上午配送</p>
                    <p class="text-xs text-gray-500 mt-0.5">08:00-12:00</p>
                </div>
                <div class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-2 text-center">
                    <p class="text-sm font-medium text-gray-600">下午配送</p>
                    <p class="text-xs text-gray-400 mt-0.5">14:00-18:00</p>
                </div>
                <div class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-2 text-center">
                    <p class="text-sm font-medium text-gray-600">晚间配送</p>
                    <p class="text-xs text-gray-400 mt-0.5">18:00-21:00</p>
                </div>
            </div>
        </div>

        <!-- Order Items -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="font-medium text-gray-800">订单商品</span>
                <span class="text-xs text-gray-400">共3件</span>
            </div>
            <div class="space-y-3">
                <!-- Item 1 -->
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 bg-green-100 rounded-lg flex items-center justify-center text-2xl">🥬</div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">新鲜小白菜</p>
                        <p class="text-xs text-gray-400">x2</p>
                    </div>
                    <span class="text-sm text-gray-600">¥7.98</span>
                </div>
                <!-- Item 2 -->
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 bg-red-100 rounded-lg flex items-center justify-center text-2xl">🍅</div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">有机西红柿</p>
                        <p class="text-xs text-gray-400">x1</p>
                    </div>
                    <span class="text-sm text-gray-600">¥4.99</span>
                </div>
                <!-- Item 3 -->
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 bg-orange-100 rounded-lg flex items-center justify-center text-2xl">🥕</div>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">新鲜胡萝卜</p>
                        <p class="text-xs text-gray-400">x1</p>
                    </div>
                    <span class="text-sm text-gray-600">¥2.99</span>
                </div>
            </div>
        </div>

        <!-- Remark -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4">
            <div class="flex items-center justify-between">
                <span class="font-medium text-gray-800">订单备注</span>
            </div>
            <textarea class="w-full mt-2 p-2 bg-gray-50 rounded-lg text-sm text-gray-600 resize-none" rows="2" placeholder="选填，可备注特殊需求，如：轻拿轻放">轻拿轻放</textarea>
        </div>

        <!-- Coupon -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fas fa-ticket-alt text-secondary"></i>
                <span class="text-sm text-gray-700">优惠券</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-secondary">-¥5.00</span>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </div>

        <!-- Payment Method -->
        <div class="mx-4 mt-3 bg-white rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="font-medium text-gray-800">支付方式</span>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center">
                        <i class="fab fa-weixin text-white text-sm"></i>
                    </div>
                    <span class="text-sm text-gray-700">微信支付</span>
                </div>
                <div class="w-5 h-5 border-2 border-primary rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-primary rounded-full"></div>
                </div>
            </div>
        </div>

        <div class="h-24"></div>
    </div>

    <!-- Bottom Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm text-gray-500">合计：</span>
            <div>
                <span class="text-secondary font-bold text-xl">¥10.96</span>
                <span class="text-xs text-gray-400 ml-1 line-through">¥15.96</span>
            </div>
        </div>
        <button class="w-full h-12 bg-primary text-white rounded-full font-medium">
            提交订单
        </button>
    </div>
</body>
</html>
